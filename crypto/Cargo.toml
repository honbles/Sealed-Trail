[package]
name = "st-crypto"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Sealed Trail crypto core: Pedersen over Ristretto255, aggregated Bulletproof range proofs, zero-or-floor sigma-OR, limb proofs"

[lib]
name = "st_crypto"
crate-type = ["rlib", "cdylib"]

[dependencies]
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core"] }
bulletproofs = "5.0.0"
merlin = "3"
rand = "0.8"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
